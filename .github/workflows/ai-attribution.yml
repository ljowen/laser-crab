# This repo dogfooding its own action, pinned to the working tree rather
# than a tag so a PR tests the code it changes.
name: AI attribution check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Needed only because `uses: ./` requires the action on disk. Consumers
      # referencing ljowen/laser-crab@v1 don't need a checkout at all.
      # Pinned to the base commit: never check out PR code under
      # pull_request_target, which runs with a writable token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: ./
