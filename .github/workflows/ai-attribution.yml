name: AI attribution check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target (not pull_request) so the job gets a writable token on
# fork PRs. Safe here because we never check out or execute PR code -- the
# checkout below is pinned to the base repo and we only read commit metadata.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out base repo (trusted code only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Scan commits for AI attribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Commit the image is served from -- the base commit, which is the
          # same tree this workflow and script were read from.
          MEME_REF: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-attribution.mjs
